<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Maverick Digital Hub builds polished websites, branding, and digital experiences for businesses that want to look more credible online."
		/>
		<meta
			name="keywords"
			content="Maverick Digital Hub, web design Uganda, branding Kampala, SEO, UI UX design, digital agency"
		/>
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#f3f6f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b1118" media="(prefers-color-scheme: dark)" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Maverick Digital Hub" />
		<meta
			property="og:title"
			content="Maverick Digital Hub | Web Design, Branding and Digital Solutions"
		/>
		<meta
			property="og:description"
			content="Thoughtful websites, stronger branding, and digital work that helps businesses look polished and credible online."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Maverick Digital Hub | Web Design, Branding and Digital Solutions"
		/>
		<meta
			name="twitter:description"
			content="Thoughtful websites, stronger branding, and digital work that helps businesses look polished and credible online."
		/>
		<script>
			/* Apply the theme before first paint so there is no light/dark flash. */
			(function () {
				try {
					var t = localStorage.getItem("mdh-theme");
					if (t !== "dark" && t !== "light") {
						t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					}
					if (t === "dark") document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = t;
				} catch (e) {}
			})();
		</script>
		<title>Maverick Digital Hub | Web Design, Branding and Digital Solutions</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
